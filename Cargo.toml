# `cargo run` and `cargo test` here still only touch Kaye. The installer is built by
# scripts/build-installer.ps1.
[workspace]
members = ["installer", "android"]

[workspace.package]
version = "0.1.5"

[package]
name = "kaye"
version.workspace = true
edition = "2024"
description = "A Blender-style animation tool built only for Roblox rigs"

[dependencies]
base64 = "0.23.1"
bytemuck ={ version = "1.25.2", features = ["derive"] }
draco-core = "2"
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland", "clipboard", "links"] }
egui = "0.37.0"
glam = { version = "0.34.2", features = ["serde"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "ico"] }
mlua = { version = "0.12", features = ["luau", "vendored"] }
pollster = "0.4.0"
raw-window-handle = "0.6.2"
rbx_binary = "3.0.1"
rbx_dom_weak = "4.2.0"
rbx_types = "3.1.0"
rbx_xml = "3.0.1"
resvg = { version = "0.49.0", default-features = false }
ring = "0.17"
semver = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = "3"
ustr = "1.1.0"

[features]
# Scripted UI testing: see src/devscript.rs.
devtools = []

# Without devtools, KAYE_SETTINGS is ignored and a run would touch the real settings.
[[example]]
name = "frametime"
required-features = ["devtools"]

# Keep debug builds usable: unoptimized wgpu and egui are very slow.
[profile.dev.package."*"]
opt-level = 2

# Android has no file dialogs of its own, so src/files.rs asks the phone instead.
[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.17.2"

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["android-native-activity"] }
jni = "0.21.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Credentials", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"
