# Builds the Android .apk on GitHub, so a change can be tried on a phone without a computer.
# Runs on pushes to any branch but main, and by hand from the Actions tab.
#
# Each build is uploaded as a pre-release named after its branch, so the .apk can be
# downloaded straight from the Releases page on a phone. Pre-releases don't count as the
# latest release, and the in-app updater reads latest-android.json, so neither notices them.
#
# Signing: add two repository secrets (Settings > Secrets and variables > Actions) to sign
# with the real key, so builds install over Kaye already on a phone:
#   KAYE_KEYSTORE_BASE64    kaye-release.jks from the tools folder's kaye-android, as base64
#                           (PowerShell: [Convert]::ToBase64String([IO.File]::ReadAllBytes("kaye-release.jks")))
#   KAYE_KEYSTORE_PASSWORD  the contents of password.txt beside it
# Without them, builds are signed with a throwaway key and need Kaye uninstalled first.

name: Android build

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" > /dev/null

      - name: Rust for Android
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KAYE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kaye-release.jks"
            echo "KAYE_KEYSTORE=$RUNNER_TEMP/kaye-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          KAYE_KEYSTORE_PASSWORD: ${{ secrets.KAYE_KEYSTORE_PASSWORD }}
        run: bash scripts/build-apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: kaye-apk
          path: dist/*.apk

      - name: Pre-release for phones
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          tag="test-$(echo "$BRANCH" | tr -c 'A-Za-z0-9.-' '-' | sed 's/-*$//')"
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" dist/*.apk --prerelease --target "$GITHUB_SHA" \
            --title "Test build: $BRANCH" \
            --notes "Built from \`$BRANCH\` at ${GITHUB_SHA::7}. Not a real release. If the file name ends in -test, uninstall Kaye before installing it."
